<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Posts App</title></head><body><div id="app"><h1>Blog Posts</h1><div v-if="posts.length"><div v-for="post in posts" :key="post.id" class="post"><h2>{{ post.title }}</h2><p>{{ post.content }}</p><hr></div></div><div v-else><p>No posts available.</p></div><div><h3>Create New Post</h3><form @submit.prevent="createPost"><label for="title">Title:</label> <input v-model="newPost.title" id="title" required><br><label for="content">Content:</label> <textarea v-model="newPost.content" id="content" required></textarea><br><button type="submit">Submit</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script><script defer="defer" src="bundle.js"></script></body></html>
